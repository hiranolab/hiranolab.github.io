- date: 2026-10-10
  ja: "2026年度日本生体医工学会東海支部大会で，吉川乃愛さんが「体表脈波を用いた頭部動脈の血管力学特性計測の試み」を発表しました．"
  en: "Noa Yoshikawa, a master’s student in our laboratory, presented her work on measuring the mechanical properties of head arteries from body-surface pulse waves at the JSMBE Tokai Branch Meeting 2026."
