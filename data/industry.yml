  - { ja: 共同研究, en: Joint research }
  - { ja: 受託研究, en: Contract research }
  - { ja: 学術指導, en: Academic advice }
steps:
  - { ja: メールでご相談ください（ご関心のある技術や課題を簡単にお知らせください）．, en: "Contact us by email with a brief description of the technology or problem you are interested in." }
  - { ja: 打ち合わせ（オンライン可）で，課題や進め方を一緒に検討します．, en: "We meet (online is fine) to discuss the problem and how we might work on it together." }
steps_todo_note: { ja: 受け付ける相談の形を確認してください, en: "Please confirm the types of collaboration accepted" }

