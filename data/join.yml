  - title: { ja: 見学・相談, en: Visits and enquiries }
    items:
      - { ja: 研究室の見学や研究内容の相談は随時受け付けています．メールで希望日時をお知らせください．, en: "You are welcome to visit the lab or ask about our research at any time. Please email us with your preferred dates." }
    contact: true
