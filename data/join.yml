              - { ja: 江南厚生病院, en: Konan Kosei Hospital }
              - { ja: 日本赤十字社愛知医療センター名古屋第二病院, en: Japanese Red Cross Aichi Medical Center Nagoya Daini Hospital }
              - { ja: 一宮西病院, en: Ichinomiya Nishi Hospital }
              - { ja: 大幸砂田橋クリニック, en: Daiko Sunadabashi Clinic }
