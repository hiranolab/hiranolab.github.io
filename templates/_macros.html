{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
{% if name == 'vessel' %}
  <path d="M4 10c6 0 8 4 12 4s6-4 12-4"/><path d="M4 22c6 0 8-4 12-4s6 4 12 4"/><path d="M10 16h3M19 16h3"/>
{% elif name == 'pressure' %}
  <path d="M5 22a11 11 0 1 1 22 0"/><path d="M16 22l5-7"/><circle cx="16" cy="22" r="1.6"/><path d="M8 26h16"/>
{% elif name == 'heart' %}
  <path d="M16 27s-10-6-10-13a5.5 5.5 0 0 1 10-3 5.5 5.5 0 0 1 10 3c0 7-10 13-10 13z"/><path d="M8 17h4l2-3 3 6 2-3h5"/>
{% elif name == 'brain' %}
  <path d="M16 7v19"/><path d="M16 9a4 4 0 0 0-7.5-1.5A4.5 4.5 0 0 0 6 15a4.5 4.5 0 0 0 3 7 4 4 0 0 0 7 3"/><path d="M16 9a4 4 0 0 1 7.5-1.5A4.5 4.5 0 0 1 26 15a4.5 4.5 0 0 1-3 7 4 4 0 0 1-7 3"/>
{% elif name == 'alarm' %}
  <path d="M9 22V15a7 7 0 0 1 14 0v7"/><path d="M6 22h20"/><path d="M14 26h4"/><path d="M4 9l3 2M28 9l-3 2"/>
{% elif name == 'forecast' %}
  <path d="M3 20h4l2.5-6 3 10 2.5-7 2 3"/><path d="M17 20h4l3-7" stroke-dasharray="2 2.6"/><circle cx="25.5" cy="11" r="2"/><path d="M5 27h22"/>
{% elif name == 'dialysis' %}
  <path d="M16 5s-7 8-7 13a7 7 0 0 0 14 0c0-5-7-13-7-13z"/><path d="M12.5 19a3.5 3.5 0 0 0 3.5 3.5"/>
{% elif name == 'pump' %}
  <circle cx="16" cy="16" r="7"/><path d="M16 9v14M9 16h14"/><path d="M4 12c2-6 6-8 12-8M28 20c-2 6-6 8-12 8"/><path d="M14 4l2 0 0 2M18 28l-2 0 0-2"/>
{% elif name == 'sensor' %}
  <rect x="9" y="9" width="14" height="14" rx="2"/><path d="M13 4v5M19 4v5M13 23v5M19 23v5M4 13h5M4 19h5M23 13h5M23 19h5"/>
{% else %}
  <path d="M3 17h6l3-8 4 14 3-9 2 3h8"/>
{% endif %}
</svg>
{%- endmacro %}

{% macro news_list(items) -%}
<ol class="news-list">
{% for n in items %}
  <li>
    <time datetime="{{ n.date }}">{{ d(n.date) }}</time>
    <p>{{ p(n) }}{% if n.links %}{% for u in n.links %} <a class="ref" href="{{ u }}" rel="noopener">[{{ loop.index }}]</a>{% endfor %}{% endif %}</p>
  </li>
{% endfor %}
</ol>
{%- endmacro %}
